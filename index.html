<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wai & Myat SRT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 20px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
    .header { text-align: center; margin-bottom: 10px; }
    .header h2 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: #8b949e; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; font-weight: 600; color: #8b949e; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.9rem; outline: none; }
    input[type="file"] { display: none; }
    .file-drop-area { border: 2px dashed #30363d; border-radius: 8px; padding: 25px 15px; text-align: center; cursor: pointer; transition: 0.2s; background: #0d1117; }
    .file-drop-area.active { border-color: #58a6ff; background: #1f242c; }
    .file-name { font-size: 0.85rem; color: #3fb950; margin-top: 8px; word-break: break-all; }
    button { padding: 12px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #238636; color: white; }
    .btn-primary:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
    .btn-download { background-color: #1f6feb; color: white; display: none; }
    .status { font-size: 0.85rem; text-align: center; color: #8b949e; min-height: 18px; line-height: 1.4; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Wai & Myat SRT</h2>
    <p>SRT သို့မဟုတ် Video မှ မြန်မာ Subtitle အလိုအလျောက် ထုတ်ယူစနစ်</p>
  </div>

  <div class="card">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>SRT သို့မဟုတ် Video ဖိုင် ရွေးချယ်ပါ</label>
    <label for="fileInput" class="file-drop-area" id="dropArea">
      <div id="dropText">📁 SRT သို့မဟုတ် Video (mp4/mkv/webm) တင်ပါ</div>
      <div class="file-name" id="fileName"></div>
    </label>
    <input type="file" id="fileInput" accept=".srt,video/mp4,video/mkv,video/webm,.mp4,.mkv,.webm,audio/*">

    <button class="btn-primary" id="translateBtn">မြန်မာလို ဘာသာပြန်မည်</button>
    <div class="status" id="statusText"></div>
    <button class="btn-download" id="downloadBtn">📥 Download Wai & Myat SRT</button>
  </div>
</div>

<script>
  let selectedFile = null;
  let translatedSrtResult = "";

  const fileInput = document.getElementById('fileInput');
  const fileNameDisplay = document.getElementById('fileName');
  const translateBtn = document.getElementById('translateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusText = document.getElementById('statusText');
  const apiKeyInput = document.getElementById('apiKey');

  if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
  }

  fileInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      fileNameDisplay.textContent = `${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(2)} MB)`;
    }
  });

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
  });

  const fileToText = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsText(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  translateBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("Gemini API Key ထည့်ပေးပါ");
    if (!selectedFile) return alert("ဖိုင် အရင်ရွေးချယ်ပေးပါ");

    localStorage.setItem('gemini_api_key', apiKey);
    translateBtn.disabled = true;
    downloadBtn.style.display = "none";
    statusText.textContent = "ဖိုင်ကို စစ်ဆေးပြင်ဆင်နေပါသည်...";

    try {
      const isSrt = selectedFile.name.toLowerCase().endsWith('.srt');
      let contentsPayload = [];

      if (isSrt) {
        statusText.textContent = "SRT စာသားများကို ဘာသာပြန်နေပါသည်...";
        const srtText = await fileToText(selectedFile);
        const prompt = `You are an expert English to Myanmar subtitle translator.
Translate the following English SRT into natural, conversational Myanmar spoken language (စကားပြောဟန်).
CRITICAL RULES:
1. Preserve subtitle sequence numbers and timestamps EXACTLY.
2. Return ONLY valid SRT plain text format. Do not add markdown code fences (\`\`\`srt).

SRT Content:
${srtText}`;
        contentsPayload = [{ parts: [{ text: prompt }] }];
      } else {
        if (selectedFile.size > 20 * 1024 * 1024) {
          throw new Error("ဖုန်း Browser မှ တိုက်ရိုက်ပို့ရန် Video ဖိုင်ဆိုဒ် 20MB အောက်သာ ဖြစ်ရပါမည်။ ဖိုင်အရမ်းကြီးပါက အသံဖိုင် (Audio/MP3) ပြောင်းပြီး တင်ပေးပါ။");
        }
        statusText.textContent = "ဗီဒီယိုဖိုင်ကို ပို့ဆောင်နေပါသည် (ခေတ္တစောင့်ပါ)...";
        const base64Data = await fileToBase64(selectedFile);
        const mimeType = selectedFile.type || 'video/mp4';

        const prompt = `Listen to the spoken audio in this video/audio carefully.
Generate accurate Myanmar subtitles in standard SRT format with proper timestamps.
Rules:
1. Use standard SRT format (index, timestamp '00:00:00,000 --> 00:00:00,000', text).
2. The dialogue must be natural, conversational Myanmar spoken language (စကားပြောဟန်).
3. Return ONLY the raw SRT plain text without markdown wrappers (\`\`\`srt).`;

        contentsPayload = [{
          parts: [
            { inline_data: { mime_type: mimeType, data: base64Data } },
            { text: prompt }
          ]
        }];
      }

      statusText.textContent = "Gemini AI မှ စာတန်းထိုး ထုတ်ပေးနေပါသည်...";

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: contentsPayload })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      translatedSrtResult = data.candidates[0].content.parts[0].text.replace(/^```srt\n?|^```\n?|```$/gm, '').trim();

      statusText.textContent = "အောင်မြင်စွာ ပြီးဆုံးပါပြီ!";
      downloadBtn.style.display = "block";
    } catch (err) {
      statusText.textContent = "Error: " + err.message;
    } finally {
      translateBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([translatedSrtResult], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const baseName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;
    a.download = `${baseName}_Wai_Myat.srt`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
