<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wai & Myat AI Dubbing Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #e6edf3; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    .header { text-align: center; }
    .header h2 { color: #58a6ff; font-size: 1.4rem; font-weight: 700; }
    .header p { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.8rem; font-weight: 600; color: #8b949e; }
    input[type="password"], select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.85rem; outline: none; }
    .file-drop-area { border: 2px dashed #388bfd; border-radius: 10px; padding: 18px 10px; text-align: center; cursor: pointer; background: #0d1117; }
    .file-name { font-size: 0.8rem; color: #3fb950; margin-top: 6px; word-break: break-all; }
    button { padding: 12px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #238636; color: white; }
    .btn-primary:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
    .btn-action { background-color: #1f6feb; color: white; margin-top: 6px; }
    .status { font-size: 0.8rem; text-align: center; color: #8b949e; min-height: 18px; line-height: 1.4; }
    .preview-box { display: none; flex-direction: column; gap: 10px; }
    video, canvas { width: 100%; border-radius: 8px; background: black; max-height: 380px; object-fit: contain; }
    textarea { width: 100%; height: 110px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-size: 0.8rem; resize: vertical; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Wai & Myat AI Dubbing Studio</h2>
    <p>Video မှ မြန်မာအသံထွက် (Voiceover) နှင့် စာတန်းထိုး တိုက်ရိုက်ထုတ်လုပ်စနစ်</p>
  </div>

  <div class="card">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>အသံသွင်းမှု ပုံစံ ရွေးချယ်ပါ</label>
    <select id="voiceMode">
      <option value="dubbing">၁။ ဗီဒီယို စကားပြောနေရာတွင် မြန်မာလို အသံထပ်သွင်းမည် (Dubbing)</option>
      <option value="recap">၂။ TikTok ဟန် မြန်မာဇာတ်လမ်းပြော အသံသွင်းမည် (Recap Narration)</option>
    </select>

    <label>ဗီဒီယို ရွေးချယ်ပါ (၁ မိနစ်မှ ၂ မိနစ်ခန့် အကြံပြုပါသည်)</label>
    <label for="videoInput" class="file-drop-area">
      <div>📁 ဗီဒီယိုဖိုင် ရွေးရန် နှိပ်ပါ (mp4/webm)</div>
      <div class="file-name" id="fileName"></div>
    </label>
    <input type="file" id="videoInput" accept="video/*" style="display:none">

    <button class="btn-primary" id="processBtn">ဗီဒီယို စတင်ဖန်တီးမည်</button>
    <div class="status" id="statusText"></div>
  </div>

  <div class="card preview-box" id="resultCard">
    <label>မြန်မာအသံထွက်နှင့် နမူနာ ဗီဒီယို</label>
    <video id="player" controls playsinline></video>
    <canvas id="renderCanvas" style="display:none;"></canvas>
    
    <label>ထုတ်လုပ်ထားသော မြန်မာဇာတ်ညွှန်း (Script / SRT)</label>
    <textarea id="scriptText" readonly></textarea>
    
    <button class="btn-action" id="playVoiceBtn" style="background:#2ea043;">🔊 မြန်မာအသံနှင့် ဗီဒီယို တွဲဖွင့်မည်</button>
    <button class="btn-action" id="downloadSrtBtn">📥 Download SRT ဖိုင်</button>
    <button class="btn-action" id="exportVideoBtn" style="background:#8957e5;">🎬 မြန်မာအသံ + စာတန်းထိုးပါ Video အဖြစ် ဒေါင်းလုဒ်ဆွဲမည်</button>
  </div>
</div>

<script>
  let selectedFile = null;
  let parsedSubtitles = [];
  let currentSrtRaw = "";
  let spokenIndex = -1;

  const apiKeyInput = document.getElementById('apiKey');
  const videoInput = document.getElementById('videoInput');
  const fileName = document.getElementById('fileName');
  const processBtn = document.getElementById('processBtn');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');
  const player = document.getElementById('player');
  const scriptText = document.getElementById('scriptText');
  const downloadSrtBtn = document.getElementById('downloadSrtBtn');
  const exportVideoBtn = document.getElementById('exportVideoBtn');
  const renderCanvas = document.getElementById('renderCanvas');
  const voiceMode = document.getElementById('voiceMode');
  const playVoiceBtn = document.getElementById('playVoiceBtn');

  if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
  }

  videoInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      fileName.textContent = `${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(1)} MB)`;
      player.src = URL.createObjectURL(selectedFile);
    }
  });

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
  });

  function parseSRT(data) {
    const regex = /(\d+)\s+(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s+([\s\S]*?)(?=\n\s*\n|\n*$)/g;
    const items = [];
    let match;
    while ((match = regex.exec(data)) !== null) {
      items.push({
        index: parseInt(match[1]),
        start: timeToSeconds(match[2]),
        end: timeToSeconds(match[3]),
        text: match[4].replace(/\n/g, ' ').trim()
      });
    }
    return items;
  }

  function timeToSeconds(timeStr) {
    const parts = timeStr.replace(',', '.').split(':');
    return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
  }

  function speakMyanmar(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'my-MM';
    utterance.rate = 1.05;
    window.speechSynthesis.speak(utterance);
  }

  processBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("Gemini API Key ထည့်ပေးပါ");
    if (!selectedFile) return alert("ဗီဒီယိုဖိုင် အရင်ရွေးပေးပါ");

    localStorage.setItem('gemini_api_key', apiKey);
    processBtn.disabled = true;
    resultCard.style.display = "none";
    statusText.textContent = "ဗီဒီယိုကို AI သို့ ပို့ဆောင်နေပါသည် (ခေတ္တစောင့်ပါ)...";

    const isRecap = voiceMode.value === 'recap';
    const prompt = isRecap 
      ? `Watch this movie clip. Create an engaging Movie Recap narration script in natural Myanmar spoken language (စကားပြောဟန်).
Format strictly as standard SRT with timestamps matching the video scene progress.
Make it sound like an exciting movie storyteller narrator.
Return ONLY valid SRT format without markdown code fences.`
      : `Listen to the speech in this video carefully.
Translate all dialogue into natural, conversational Myanmar spoken language for movie dubbing.
Format strictly as valid standard SRT format with accurate timestamps:
1
00:00:01,000 --> 00:00:03,500
[စကားပြော]
Return ONLY raw plain SRT format without markdown tags.`;

    try {
      const base64Data = await fileToBase64(selectedFile);
      statusText.textContent = "AI မှ မြန်မာဇာတ်ညွှန်းနှင့် အသံကို ဖန်တီးနေပါသည်...";

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: selectedFile.type || 'video/mp4', data: base64Data } },
              { text: prompt }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      currentSrtRaw = data.candidates[0].content.parts[0].text.replace(/^```srt\n?|^```\n?|```$/gm, '').trim();
      parsedSubtitles = parseSRT(currentSrtRaw);
      scriptText.value = currentSrtRaw;

      resultCard.style.display = "flex";
      statusText.textContent = "အောင်မြင်ပါပြီ! မြန်မာအသံဖြင့် ဗီဒီယိုကို နားဆင်နိုင်ပါပြီ။";
    } catch (err) {
      statusText.textContent = "Error: " + err.message;
    } finally {
      processBtn.disabled = false;
    }
  });

  player.addEventListener('timeupdate', () => {
    const cur = player.currentTime;
    const currentSub = parsedSubtitles.find(s => cur >= s.start && cur <= s.end);
    if (currentSub && spokenIndex !== currentSub.index) {
      spokenIndex = currentSub.index;
      speakMyanmar(currentSub.text);
    }
  });

  playVoiceBtn.addEventListener('click', () => {
    spokenIndex = -1;
    player.volume = 0.25;
    player.currentTime = 0;
    player.play();
  });

  exportVideoBtn.addEventListener('click', () => {
    if (!parsedSubtitles.length) return alert("စာတန်းထိုး မရှိသေးပါ");
    
    exportVideoBtn.disabled = true;
    statusText.textContent = "စာတန်းထိုးပါ ဗီဒီယိုအသစ် ထုတ်လုပ်နေပါသည် (ခဏစောင့်ပါ)...";

    const ctx = renderCanvas.getContext('2d');
    renderCanvas.width = player.videoWidth || 720;
    renderCanvas.height = player.videoHeight || 1280;

    const stream = renderCanvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Wai_Myat_Dubbed_${Date.now()}.webm`;
      a.click();
      exportVideoBtn.disabled = false;
      statusText.textContent = "ဗီဒီယို ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ!";
    };

    recorder.start();
    player.currentTime = 0;
    player.play();

    function drawFrame() {
      if (player.paused || player.ended) {
        recorder.stop();
        return;
      }
      ctx.drawImage(player, 0, 0, renderCanvas.width, renderCanvas.height);
      
      const cur = player.currentTime;
      const sub = parsedSubtitles.find(s => cur >= s.start && cur <= s.end);
      if (sub) {
        ctx.font = `bold ${Math.round(renderCanvas.height * 0.035)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 6;
        const x = renderCanvas.width / 2;
        const y = renderCanvas.height * 0.88;
        ctx.strokeText(sub.text, x, y);
        ctx.fillText(sub.text, x, y);
      }
      requestAnimationFrame(drawFrame);
    }
    drawFrame();
  });

  downloadSrtBtn.addEventListener('click', () => {
    const blob = new Blob([currentSrtRaw], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "Wai_Myat_Subtitle.srt";
    a.click();
  });
</script>
</body>
</html>
