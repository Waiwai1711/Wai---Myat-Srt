<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wai & Myat - Hybrid Video SRT Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #e6edf3; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }
    .header { text-align: center; }
    .header h2 { color: #58a6ff; font-size: 1.35rem; font-weight: 700; }
    .header p { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }
    
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.8rem; font-weight: 600; color: #8b949e; }
    input[type="password"], select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.85rem; outline: none; }
    
    .file-drop-area { border: 2px dashed #388bfd; border-radius: 10px; padding: 18px 10px; text-align: center; cursor: pointer; background: #0d1117; }
    .file-name { font-size: 0.8rem; color: #3fb950; margin-top: 6px; word-break: break-all; }
    
    button { padding: 12px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #238636; color: white; }
    .btn-primary:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
    .btn-action { background-color: #1f6feb; color: white; margin-top: 4px; }
    .btn-update { background-color: #d29922; color: #000; font-weight: 700; }
    .btn-export { background-color: #8957e5; color: white; font-weight: bold; margin-top: 4px; }
    
    .status { font-size: 0.8rem; text-align: center; color: #8b949e; min-height: 18px; line-height: 1.4; word-break: break-all; }
    .preview-box { display: none; flex-direction: column; gap: 10px; }
    
    .video-container { display: flex; justify-content: center; background: #000; border-radius: 8px; overflow: hidden; }
    .video-wrapper { position: relative; display: inline-block; max-width: 100%; }
    video { display: block; max-height: 420px; max-width: 100%; object-fit: contain; }
    .subtitle-overlay { 
      position: absolute; 
      bottom: 25px; 
      left: 12px; 
      right: 12px; 
      text-align: center; 
      color: #ffff00; 
      font-size: 1.05rem; 
      font-weight: bold; 
      text-shadow: 2px 2px 3px #000, -2px -2px 3px #000, 2px -2px 3px #000, -2px 2px 3px #000; 
      pointer-events: none;
      line-height: 1.4;
      word-wrap: break-word;
    }
    
    textarea { height: 170px; resize: vertical; line-height: 1.4; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Wai & Myat Video Subtitle Studio</h2>
    <p>Gemini & Groq (Auto Fallback / မျှသုံးစနစ်)</p>
  </div>

  <div class="card">
    <label>အလုပ်လုပ်မည့် ပုံစံ</label>
    <select id="modeSelect">
      <option value="auto">🔄 Gemini + Groq Auto Fallback (Gemini ကြပ်ရင် Groq ကို အလိုအလျောက် သုံးမည်)</option>
      <option value="gemini_only">Google Gemini သီးသန့်</option>
      <option value="groq_only">Groq (Whisper + Llama) သီးသန့်</option>
    </select>

    <label>Gemini API Key</label>
    <input type="password" id="geminiKey" placeholder="AIzaSy...">

    <label>Groq API Key (console.groq.com မှ အခမဲ့ယူနိုင်)</label>
    <input type="password" id="groqKey" placeholder="gsk_...">

    <label>ဗီဒီယိုဖိုင် ရွေးချယ်ပါ (mp4/webm)</label>
    <label for="videoInput" class="file-drop-area">
      <div>📁 ဗီဒီယိုဖိုင် ရွေးရန် နှိပ်ပါ</div>
      <div class="file-name" id="fileName"></div>
    </label>
    <input type="file" id="videoInput" accept="video/*" style="display:none">

    <button class="btn-primary" id="processBtn">မြန်မာစာတန်းထိုး ထုတ်မည်</button>
    <div class="status" id="statusText"></div>
  </div>

  <div class="card preview-box" id="resultCard">
    <label>🎬 Video ပေါ်တွင် စာတန်းထိုး တိုက်စစ်ခြင်း</label>
    <div class="video-container">
      <div class="video-wrapper">
        <video id="player" controls playsinline></video>
        <div class="subtitle-overlay" id="subOverlay"></div>
      </div>
    </div>
    
    <label>✏️ မြန်မာ SRT စာသားများကို ပြင်ဆင်နိုင်ပါသည် (Edit Box)</label>
    <textarea id="srtEditor"></textarea>
    
    <button class="btn-update" id="syncBtn">🔄 ပြင်ဆင်ချက်များကို Video ပေါ် အသစ်ပြန်တင်မည်</button>
    <button class="btn-export" id="exportVideoBtn">🎥 စာတန်းထိုးပြီးသား Video အဖြစ် ဒေါင်းလုဒ်ဆွဲမည်</button>
    <button class="btn-action" id="downloadSrtBtn">📥 ပြင်ဆင်ပြီး SRT ဖိုင် ဒေါင်းလုဒ်ဆွဲမည်</button>
  </div>
</div>

<script>
  let selectedFile = null;
  let parsedSubtitles = [];

  const modeSelect = document.getElementById('modeSelect');
  const geminiKey = document.getElementById('geminiKey');
  const groqKey = document.getElementById('groqKey');
  const videoInput = document.getElementById('videoInput');
  const fileName = document.getElementById('fileName');
  const processBtn = document.getElementById('processBtn');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');
  const player = document.getElementById('player');
  const subOverlay = document.getElementById('subOverlay');
  const srtEditor = document.getElementById('srtEditor');
  const syncBtn = document.getElementById('syncBtn');
  const downloadSrtBtn = document.getElementById('downloadSrtBtn');
  const exportVideoBtn = document.getElementById('exportVideoBtn');

  if (localStorage.getItem('gemini_api_key')) geminiKey.value = localStorage.getItem('gemini_api_key');
  if (localStorage.getItem('groq_api_key')) groqKey.value = localStorage.getItem('groq_api_key');

  videoInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      fileName.textContent = `${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(1)} MB)`;
      player.src = URL.createObjectURL(selectedFile);
    }
  });

  async function extractCompressedAudio(file) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuffer = await file.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);

    const targetSampleRate = 8000;
    const offlineCtx = new OfflineAudioContext(1, decoded.duration * targetSampleRate, targetSampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = decoded;
    source.connect(offlineCtx.destination);
    source.start(0);
    const renderedBuffer = await offlineCtx.startRendering();
    const channelData = renderedBuffer.getChannelData(0);

    const wavBuffer = new ArrayBuffer(44 + channelData.length * 2);
    const view = new DataView(wavBuffer);
    const wStr = (offset, s) => {
      for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
    };
    wStr(0, 'RIFF');
    view.setUint32(4, 36 + channelData.length * 2, true);
    wStr(8, 'WAVE');
    wStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, targetSampleRate, true);
    view.setUint32(28, targetSampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    wStr(36, 'data');
    view.setUint32(40, channelData.length * 2, true);

    let offset = 44;
    for (let i = 0; i < channelData.length; i++, offset += 2) {
      let s = Math.max(-1, Math.min(1, channelData[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    const bytes = new Uint8Array(wavBuffer);
    return { blob: new Blob([wavBuffer], { type: 'audio/wav' }), bytes: bytes };
  }

  function bytesToBase64(bytes) {
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function parseSRT(data) {
    const regex = /(\d+)\s+(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s+([\s\S]*?)(?=\n\s*\n|\n*$)/g;
    const items = [];
    let match;
    while ((match = regex.exec(data)) !== null) {
      items.push({
        start: timeToSeconds(match[2]),
        end: timeToSeconds(match[3]),
        text: match[4].replace(/\n/g, ' ').trim()
      });
    }
    return items;
  }

  function timeToSeconds(timeStr) {
    const parts = timeStr.replace(',', '.').split(':');
    return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
  }

  player.addEventListener('timeupdate', () => {
    const cur = player.currentTime;
    const active = parsedSubtitles.find(s => cur >= s.start && cur <= s.end);
    subOverlay.textContent = active ? active.text : "";
  });

  // Call Gemini API
  async function runGemini(audioData, key) {
    const base64 = bytesToBase64(audioData.bytes);
    const prompt = `Listen carefully. Translate all dialogue into natural spoken Burmese (မြန်မာစကားပြော).
Format strictly as standard SRT:
1
00:00:01,000 --> 00:00:03,500
[မြန်မာစကားပြော]
Return ONLY raw SRT text without markdown fences.`;

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inlineData: { mimeType: "audio/wav", data: base64 } },
            { text: prompt }
          ]
        }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text;
  }

  // Call Groq API (Whisper + Llama 3)
  async function runGroq(audioData, key) {
    statusText.textContent = "Groq Whisper ဖြင့် အသံဖမ်းယူနေပါသည်...";
    const formData = new FormData();
    formData.append('file', audioData.blob, 'audio.wav');
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'srt');

    const whisperRes = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${key}` },
      body: formData
    });
    const originalSrt = await whisperRes.text();

    statusText.textContent = "Groq Llama 3 ဖြင့် မြန်မာစကားပြော ဘာသာပြန်နေပါသည်...";
    const transRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: [{
          role: "user",
          content: `Translate every line in this SRT to natural, conversational spoken Burmese (မြန်မာစကားပြော). Keep the exact timestamps and index numbers intact. Output raw SRT only:\n\n${originalSrt}`
        }]
      })
    });
    const transData = await transRes.json();
    if (transData.error) throw new Error(transData.error.message);
    return transData.choices[0].message.content;
  }

  processBtn.addEventListener('click', async () => {
    const mode = modeSelect.value;
    const gKey = geminiKey.value.trim();
    const grKey = groqKey.value.trim();

    if (!selectedFile) return alert("ဗီဒီယိုဖိုင် အရင်ရွေးပေးပါ");
    if (mode === 'gemini_only' && !gKey) return alert("Gemini API Key ထည့်ပေးပါ");
    if (mode === 'groq_only' && !grKey) return alert("Groq API Key ထည့်ပေးပါ");
    if (mode === 'auto' && !gKey && !grKey) return alert("API Key အနည်းဆုံး တစ်ခု ထည့်ပေးပါ");

    if (gKey) localStorage.setItem('gemini_api_key', gKey);
    if (grKey) localStorage.setItem('groq_api_key', grKey);

    processBtn.disabled = true;
    resultCard.style.display = "none";
    statusText.textContent = "အသံဖိုင်ကို စစ်ဆေးချုံ့ယူနေပါသည်...";

    try {
      const audioData = await extractCompressedAudio(selectedFile);
      let rawSrt = "";

      if (mode === 'groq_only') {
        rawSrt = await runGroq(audioData, grKey);
      } else if (mode === 'gemini_only') {
        statusText.textContent = "Gemini AI ဖြင့် မြန်မာစာတန်းထိုး ထုတ်ပေးနေပါသည်...";
        rawSrt = await runGemini(audioData, gKey);
      } else {
        // AUTO FALLBACK MODE (Gemini အရင်စမ်းမည်၊ ကြပ်ပါက Groq သို့ ပြောင်းမည်)
        try {
          if (!gKey) throw new Error("No Gemini Key");
          statusText.textContent = "Gemini AI ဖြင့် စတင်ဆောင်ရွက်နေပါသည်...";
          rawSrt = await runGemini(audioData, gKey);
        } catch (geminiErr) {
          console.warn("Gemini Error, switching to Groq:", geminiErr);
          if (grKey) {
            statusText.textContent = "Gemini High Demand ဖြစ်နေသဖြင့် Groq သို့ အလိုအလျောက် ပြောင်းသုံးနေပါသည်...";
            rawSrt = await runGroq(audioData, grKey);
          } else {
            throw geminiErr;
          }
        }
      }

      rawSrt = rawSrt.replace(/^```srt\n?|^```\n?|```$/gm, '').trim();
      srtEditor.value = rawSrt;
      parsedSubtitles = parseSRT(rawSrt);

      resultCard.style.display = "flex";
      statusText.textContent = "အောင်မြင်စွာ ပြီးဆုံးပါပြီ! Video ဖြင့် တိုက်စစ်နိုင်ပါပြီ။";
    } catch (err) {
      statusText.textContent = "Error: " + err.message;
    } finally {
      processBtn.disabled = false;
    }
  });

  syncBtn.addEventListener('click', () => {
    parsedSubtitles = parseSRT(srtEditor.value);
    alert("ပြင်ဆင်ချက်များကို Video ပေါ် ချိတ်ဆက်လိုက်ပါပြီ!");
  });

  downloadSrtBtn.addEventListener('click', () => {
    const blob = new Blob([srtEditor.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "Subtitles_Edited.srt";
    a.click();
  });

  exportVideoBtn.addEventListener('click', async () => {
    if (!parsedSubtitles.length) return alert("စာတန်းထိုး အရင်ထုတ်ယူပါ");

    exportVideoBtn.disabled = true;
    statusText.textContent = "စာတန်းထိုးထားသော Video ကို Export ထုတ်နေပါသည် (ခဏစောင့်ပါ)...";

    const canvas = document.createElement('canvas');
    canvas.width = player.videoWidth || 720;
    canvas.height = player.videoHeight || 1280;
    const ctx = canvas.getContext('2d');

    const stream = canvas.captureStream(30);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(player);
    const dest = audioCtx.createMediaStreamDestination();
    source.connect(dest);
    source.connect(audioCtx.destination);
    
    if (dest.stream.getAudioTracks().length > 0) {
      stream.addTrack(dest.stream.getAudioTracks()[0]);
    }

    let mimeType = 'video/webm;codecs=vp8,opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'video/webm';
    }
    const recorder = new MediaRecorder(stream, { mimeType });
    const recordedChunks = [];

    recorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mimeType });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Subtitled_${selectedFile ? selectedFile.name : 'video.webm'}`;
      a.click();
      statusText.textContent = "ဗီဒီယို ဒေါင်းလုဒ်ဆွဲယူပြီးပါပြီ!";
      exportVideoBtn.disabled = false;
      player.pause();
    };

    recorder.start();
    player.currentTime = 0;
    await player.play();

    function drawFrame() {
      if (player.paused || player.ended) {
        if (player.ended) recorder.stop();
        return;
      }

      ctx.drawImage(player, 0, 0, canvas.width, canvas.height);

      const cur = player.currentTime;
      const active = parsedSubtitles.find(s => cur >= s.start && cur <= s.end);

      if (active) {
        const fontSize = Math.floor(canvas.height * 0.042);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffff00";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = Math.max(3, Math.floor(fontSize * 0.15));

        const x = canvas.width / 2;
        const y = canvas.height - (canvas.height * 0.08);

        ctx.strokeText(active.text, x, y);
        ctx.fillText(active.text, x, y);
      }

      requestAnimationFrame(drawFrame);
    }

    drawFrame();
  });
</script>
</body>
</html>
