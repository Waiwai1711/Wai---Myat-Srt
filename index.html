<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wai & Myat - Myanmar SRT Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #e6edf3; padding: 20px 14px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    .header { text-align: center; }
    .header h2 { color: #58a6ff; font-size: 1.4rem; font-weight: 700; }
    .header p { font-size: 0.82rem; color: #8b949e; margin-top: 4px; }
    
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.82rem; font-weight: 600; color: #8b949e; }
    input[type="password"], select, textarea { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.85rem; outline: none; }
    
    .file-drop-area { border: 2px dashed #388bfd; border-radius: 10px; padding: 22px 12px; text-align: center; cursor: pointer; background: #0d1117; }
    .file-name { font-size: 0.82rem; color: #3fb950; margin-top: 6px; word-break: break-all; }
    
    button { padding: 13px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #238636; color: white; }
    .btn-primary:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
    .btn-download { background-color: #1f6feb; color: white; display: none; }
    .btn-copy { background-color: #30363d; color: #e6edf3; display: none; }
    
    .status { font-size: 0.82rem; text-align: center; color: #8b949e; min-height: 20px; line-height: 1.4; word-break: break-all; }
    textarea { height: 220px; resize: vertical; line-height: 1.5; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Wai & Myat SRT</h2>
    <p>Video မှ မြန်မာ Subtitle (.srt) အလိုအလျောက် ထုတ်ယူစနစ်</p>
  </div>

  <div class="card">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>Gemini Model</label>
    <select id="modelSelect">
      <option value="gemini-2.5-flash">Gemini 2.5 Flash (အကြံပြုထားသည်)</option>
      <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
      <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
    </select>

    <label>ဗီဒီယိုဖိုင် ရွေးချယ်ပါ (mp4/mkv/webm)</label>
    <label for="videoInput" class="file-drop-area">
      <div>📁 ဗီဒီယိုဖိုင် ထည့်ရန် နှိပ်ပါ</div>
      <div class="file-name" id="fileName"></div>
    </label>
    <input type="file" id="videoInput" accept="video/*,audio/*" style="display:none">

    <button class="btn-primary" id="processBtn">မြန်မာ SRT စာတန်းထိုး ထုတ်မည်</button>
    <div class="status" id="statusText"></div>

    <label>ရရှိလာသော မြန်မာ SRT ရလဒ်</label>
    <textarea id="srtOutput" readonly placeholder="ဒီနေရာမှာ SRT စာတန်းထိုးတွေ ပေါ်လာပါမယ်..."></textarea>

    <button class="btn-download" id="downloadBtn">📥 Download Wai & Myat SRT ဖိုင်</button>
    <button class="btn-copy" id="copyBtn">📋 စာသားအားလုံး Copy ကူးမည်</button>
  </div>
</div>

<script>
  let selectedFile = null;
  let srtResult = "";

  const apiKeyInput = document.getElementById('apiKey');
  const modelSelect = document.getElementById('modelSelect');
  const videoInput = document.getElementById('videoInput');
  const fileName = document.getElementById('fileName');
  const processBtn = document.getElementById('processBtn');
  const statusText = document.getElementById('statusText');
  const srtOutput = document.getElementById('srtOutput');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');

  if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
  }

  videoInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      fileName.textContent = `${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(1)} MB)`;
    }
  });

  // အသံကို ဖိုင်ဆိုဒ် အလွန်သေးငယ်အောင် ချုံ့ပြီး ဆွဲထုတ်ခြင်း (Error မတက်စေရန်)
  async function extractCompressedAudio(file) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuffer = await file.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);

    const targetSampleRate = 8000;
    const offlineCtx = new OfflineAudioContext(1, decoded.duration * targetSampleRate, targetSampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = decoded;
    source.connect(offlineCtx.destination);
    source.start(0);
    const renderedBuffer = await offlineCtx.startRendering();
    const channelData = renderedBuffer.getChannelData(0);

    const wavBuffer = new ArrayBuffer(44 + channelData.length * 2);
    const view = new DataView(wavBuffer);
    const wStr = (offset, s) => {
      for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
    };
    wStr(0, 'RIFF');
    view.setUint32(4, 36 + channelData.length * 2, true);
    wStr(8, 'WAVE');
    wStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true); // Mono
    view.setUint32(24, targetSampleRate, true);
    view.setUint32(28, targetSampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    wStr(36, 'data');
    view.setUint32(40, channelData.length * 2, true);

    let offset = 44;
    for (let i = 0; i < channelData.length; i++, offset += 2) {
      let s = Math.max(-1, Math.min(1, channelData[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    const bytes = new Uint8Array(wavBuffer);
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  processBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("Gemini API Key ထည့်ပေးပါ");
    if (!selectedFile) return alert("ဗီဒီယိုဖိုင် အရင်ရွေးပေးပါ");

    localStorage.setItem('gemini_api_key', apiKey);
    processBtn.disabled = true;
    downloadBtn.style.display = "none";
    copyBtn.style.display = "none";
    srtOutput.value = "";
    statusText.textContent = "အသံဖိုင်ကို စစ်ဆေးပြင်ဆင်နေပါသည်...";

    const chosenModel = modelSelect.value;

    try {
      const audioBase64 = await extractCompressedAudio(selectedFile);
      statusText.textContent = `${chosenModel} ဖြင့် မြန်မာစာတန်းထိုး ထုတ်ပေးနေပါသည် (ခဏစောင့်ပါ)...`;

      const prompt = `Listen to this speech carefully.
Translate all dialogue into natural, conversational Burmese language (စကားပြောဟန် မြန်မာဘာသာ).
Format strictly as standard valid SRT format with accurate timestamps:
1
00:00:01,000 --> 00:00:03,500
[မြန်မာစကားပြော]
Rules:
- Strictly return plain raw SRT text.
- Do NOT wrap in markdown code blocks like \`\`\`srt.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${chosenModel}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              {
                inlineData: {
                  mimeType: "audio/wav",
                  data: audioBase64
                }
              },
              { text: prompt }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      srtResult = data.candidates[0].content.parts[0].text.replace(/^```srt\n?|^```\n?|```$/gm, '').trim();
      srtOutput.value = srtResult;

      statusText.textContent = "အောင်မြင်စွာ ထုတ်လုပ်ပြီးပါပြီ!";
      downloadBtn.style.display = "block";
      copyBtn.style.display = "block";
    } catch (err) {
      statusText.textContent = "Error: " + err.message;
    } finally {
      processBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([srtOutput.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const baseName = selectedFile ? selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) : 'video';
    a.download = `${baseName}_Wai_Myat.srt`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(srtOutput.value).then(() => {
      alert("SRT စာသားများကို ကော်ပီကူးယူပြီးပါပြီ!");
    });
  });
</script>
</body>
</html>
