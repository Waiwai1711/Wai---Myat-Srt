<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wai & Myat - Video SRT Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pyidaungsu", "Myanmar Text", -apple-system, sans-serif; }
    body { background-color: #0b0f17; color: #e6edf3; padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }
    .header { text-align: center; }
    .header h2 { color: #58a6ff; font-size: 1.35rem; font-weight: 700; }
    .header p { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }
    
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.8rem; font-weight: 600; color: #8b949e; }
    input[type="password"], select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.85rem; outline: none; }
    
    .file-drop-area { border: 2px dashed #388bfd; border-radius: 10px; padding: 18px 10px; text-align: center; cursor: pointer; background: #0d1117; }
    .file-name { font-size: 0.8rem; color: #3fb950; margin-top: 6px; word-break: break-all; }
    
    button { padding: 12px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #238636; color: white; }
    .btn-primary:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
    .btn-action { background-color: #1f6feb; color: white; margin-top: 4px; }
    .btn-export { background-color: #8957e5; color: white; font-weight: bold; margin-top: 4px; }
    .btn-success-dl { background-color: #238636; color: white; font-weight: bold; margin-top: 4px; display: none; text-align: center; text-decoration: none; padding: 12px; border-radius: 8px; }
    
    .status { font-size: 0.82rem; text-align: center; color: #8b949e; min-height: 20px; line-height: 1.4; word-break: break-all; }
    .sub-badge { font-size: 0.8rem; color: #3fb950; font-weight: bold; text-align: center; background: rgba(63, 185, 80, 0.15); padding: 6px; border-radius: 6px; border: 1px solid #238636; }
    .preview-box { display: none; flex-direction: column; gap: 10px; }
    
    /* Video Container & Subtitle Styling */
    .video-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .video-container:fullscreen, .video-container:-webkit-full-screen { width: 100vw; height: 100vh; border-radius: 0; }
    
    video { display: block; width: 100%; max-height: 440px; object-fit: contain; }
    .video-container:fullscreen video, .video-container:-webkit-full-screen video { max-height: 100vh; }
    
    .subtitle-overlay { 
      position: absolute; 
      bottom: 58px; 
      left: 6%; 
      right: 6%; 
      text-align: center; 
      color: #FFE500; 
      font-size: 1.15rem; 
      font-weight: 700; 
      text-shadow: 2px 2px 3px #000, -2px -2px 3px #000, 2px -2px 3px #000, -2px 2px 3px #000; 
      pointer-events: none;
      line-height: 1.45;
      word-break: break-word;
      z-index: 99;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
    }
    .video-container:fullscreen .subtitle-overlay { font-size: 1.45rem; bottom: 75px; }

    .fs-toggle-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid #666;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      z-index: 100;
    }
    
    textarea { height: 170px; resize: vertical; line-height: 1.4; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Wai & Myat Video Subtitle Studio</h2>
    <p>Gemini & Groq (Auto Fallback & Accurate Time Parser)</p>
  </div>

  <div class="card">
    <label>အလုပ်လုပ်မည့် ပုံစံ</label>
    <select id="modeSelect">
      <option value="auto">🔄 Gemini + Groq Auto Fallback (အကြံပြုထားသည်)</option>
      <option value="gemini_only">Google Gemini သီးသန့်</option>
      <option value="groq_only">Groq (Whisper + Llama) သီးသန့်</option>
    </select>

    <label>Gemini API Key</label>
    <input type="password" id="geminiKey" placeholder="AIzaSy...">

    <label>Groq API Key (console.groq.com မှ အခမဲ့ယူနိုင်)</label>
    <input type="password" id="groqKey" placeholder="gsk_...">

    <label>ဗီဒီယိုဖိုင် ရွေးချယ်ပါ (mp4/webm)</label>
    <label for="videoInput" class="file-drop-area">
      <div>📁 ဗီဒီယိုဖိုင် ရွေးရန် နှိပ်ပါ</div>
      <div class="file-name" id="fileName"></div>
    </label>
    <input type="file" id="videoInput" accept="video/*" style="display:none">

    <button class="btn-primary" id="processBtn">မြန်မာစာတန်းထိုး ထုတ်မည်</button>
    <div class="status" id="statusText"></div>
  </div>

  <div class="card preview-box" id="resultCard">
    <label>🎬 Video ပေါ်တွင် စာတန်းထိုး တိုက်စစ်ခြင်း</label>
    <div class="video-container" id="videoContainer">
      <video id="player" controls playsinline preload="auto"></video>
      <div class="subtitle-overlay" id="subOverlay"></div>
      <button class="fs-toggle-btn" id="customFsBtn">⛶ စာတန်းပါ Fullscreen</button>
    </div>
    <div class="sub-badge" id="subCountBadge">စာတန်းထိုး ရှာဖွေနေပါသည်...</div>
    
    <label>✏️ မြန်မာ SRT စာသားများကို ပြင်ဆင်နိုင်ပါသည် (Edit Box)</label>
    <textarea id="srtEditor"></textarea>
    
    <button class="btn-export" id="exportVideoBtn">🎥 စာတန်းထိုးပြီးသား Video အဖြစ် ဒေါင်းလုဒ်ဆွဲမည်</button>
    <a id="directDownloadLink" class="btn-success-dl" download="Subtitled_Video.mp4">✅ ဒေါင်းလုဒ်ဖိုင် အဆင်သင့်ဖြစ်ပါပြီ (နှိပ်ပြီး သိမ်းပါ)</a>
    <button class="btn-action" id="downloadSrtBtn">📥 ပြင်ဆင်ပြီး SRT ဖိုင် ဒေါင်းလုဒ်ဆွဲမည်</button>
  </div>
</div>

<script>
  let selectedFile = null;
  let parsedSubtitles = [];

  const modeSelect = document.getElementById('modeSelect');
  const geminiKey = document.getElementById('geminiKey');
  const groqKey = document.getElementById('groqKey');
  const videoInput = document.getElementById('videoInput');
  const fileName = document.getElementById('fileName');
  const processBtn = document.getElementById('processBtn');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');
  const player = document.getElementById('player');
  const subOverlay = document.getElementById('subOverlay');
  const srtEditor = document.getElementById('srtEditor');
  const subCountBadge = document.getElementById('subCountBadge');
  const downloadSrtBtn = document.getElementById('downloadSrtBtn');
  const exportVideoBtn = document.getElementById('exportVideoBtn');
  const customFsBtn = document.getElementById('customFsBtn');
  const videoContainer = document.getElementById('videoContainer');
  const directDownloadLink = document.getElementById('directDownloadLink');

  if (localStorage.getItem('gemini_api_key')) geminiKey.value = localStorage.getItem('gemini_api_key');
  if (localStorage.getItem('groq_api_key')) groqKey.value = localStorage.getItem('groq_api_key');

  customFsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (videoContainer.requestFullscreen) videoContainer.requestFullscreen();
      else if (videoContainer.webkitRequestFullscreen) videoContainer.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  videoInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      fileName.textContent = `${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(1)} MB)`;
      player.src = URL.createObjectURL(selectedFile);
    }
  });

  async function extractCompressedAudio(file) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuffer = await file.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);

    const targetSampleRate = 8000;
    const offlineCtx = new OfflineAudioContext(1, decoded.duration * targetSampleRate, targetSampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = decoded;
    source.connect(offlineCtx.destination);
    source.start(0);
    const renderedBuffer = await offlineCtx.startRendering();
    const channelData = renderedBuffer.getChannelData(0);

    const wavBuffer = new ArrayBuffer(44 + channelData.length * 2);
    const view = new DataView(wavBuffer);
    const wStr = (offset, s) => {
      for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
    };
    wStr(0, 'RIFF');
    view.setUint32(4, 36 + channelData.length * 2, true);
    wStr(8, 'WAVE');
    wStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, targetSampleRate, true);
    view.setUint32(28, targetSampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    wStr(36, 'data');
    view.setUint32(40, channelData.length * 2, true);

    let offset = 44;
    for (let i = 0; i < channelData.length; i++, offset += 2) {
      let s = Math.max(-1, Math.min(1, channelData[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    const bytes = new Uint8Array(wavBuffer);
    return { blob: new Blob([wavBuffer], { type: 'audio/wav' }), bytes: bytes };
  }

  function bytesToBase64(bytes) {
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  // 00:06:260 (ကော်လံ ၃ ခု) ရော၊ 00:00:06,260 ကိုပါ အတိအကျ နားလည်သော Universal Time Converter
  function parseTimestampToSeconds(t) {
    if (!t) return 0;
    t = t.trim().replace(',', '.');
    const parts = t.split(':');
    
    if (parts.length === 3) {
      // 00:06:260 (MM:SS:mmm)
      if (parts[2].length >= 3 && !parts[2].includes('.')) {
        return (parseFloat(parts[0]) || 0) * 60 + (parseFloat(parts[1]) || 0) + (parseFloat(parts[2]) || 0) / 1000;
      }
      // Standard HH:MM:SS.mmm
      return (parseFloat(parts[0]) || 0) * 3600 + (parseFloat(parts[1]) || 0) * 60 + (parseFloat(parts[2]) || 0);
    } else if (parts.length === 2) {
      if (parts[1].length >= 3 && !parts[1].includes('.')) {
        return (parseFloat(parts[0]) || 0) + (parseFloat(parts[1]) || 0) / 1000;
      }
      return (parseFloat(parts[0]) || 0) * 60 + (parseFloat(parts[1]) || 0);
    } else if (parts.length === 4) {
      // HH:MM:SS:mmm
      return (parseFloat(parts[0]) || 0) * 3600 + (parseFloat(parts[1]) || 0) * 60 + (parseFloat(parts[2]) || 0) + (parseFloat(parts[3]) || 0) / 1000;
    }
    return parseFloat(t) || 0;
  }

  // မည်သည့် SRT စာသားပုံစံမဆို လုံးဝအမှားအယွင်းမရှိ ဖတ်ယူနိုင်သော Bulletproof Parser
  function parseSRT(text) {
    if (!text) return [];
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const subs = [];
    let currentSub = null;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) {
        if (currentSub && currentSub.text) {
          subs.push(currentSub);
          currentSub = null;
        }
        continue;
      }

      if (line.includes('-->')) {
        const parts = line.split('-->');
        if (currentSub && currentSub.text) {
          subs.push(currentSub);
        }
        currentSub = {
          start: parseTimestampToSeconds(parts[0]),
          end: parseTimestampToSeconds(parts[1]),
          text: ''
        };
      } else if (currentSub) {
        if (!/^\d+$/.test(line)) { // အညွှန်းနံပါတ်များကို ချန်လှပ်ခြင်း
          currentSub.text = currentSub.text ? (currentSub.text + '\n' + line) : line;
        }
      }
    }
    if (currentSub && currentSub.text) {
      subs.push(currentSub);
    }
    return subs;
  }

  function updateSubtitlesFromEditor() {
    parsedSubtitles = parseSRT(srtEditor.value);
    subCountBadge.textContent = `✅ စာတန်းထိုး (${parsedSubtitles.length}) ခု အဆင်သင့်ရှိပါသည်`;
  }

  // စာသားပြင်သည်နှင့် အလိုအလျောက် Update ပြုလုပ်ခြင်း
  srtEditor.addEventListener('input', updateSubtitlesFromEditor);

  // Video ဖွင့်နေချိန်၊ ရစ်နေချိန် စာတန်း အချိန်ကိုက် တိုက်ရိုက်ပြသခြင်း
  function updateSubtitleOverlay() {
    if (!parsedSubtitles.length) parsedSubtitles = parseSRT(srtEditor.value);
    const cur = player.currentTime;
    const active = parsedSubtitles.find(s => cur >= s.start && cur <= s.end);
    if (active && active.text) {
      subOverlay.textContent = active.text;
      subOverlay.style.display = "block";
    } else {
      subOverlay.textContent = "";
      subOverlay.style.display = "none";
    }
  }

  player.addEventListener('timeupdate', updateSubtitleOverlay);
  player.addEventListener('seeked', updateSubtitleOverlay);
  player.addEventListener('play', updateSubtitleOverlay);

  async function runGemini(audioData, key) {
    const base64 = bytesToBase64(audioData.bytes);
    const prompt = `Listen carefully. Translate all dialogue into natural spoken Burmese (မြန်မာစကားပြော).
Format strictly as standard valid SRT format with accurate timestamps:
1
00:00:01,000 --> 00:00:03,500
[မြန်မာစကားပြော]
Return plain raw SRT text only without markdown tags.`;

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inlineData: { mimeType: "audio/wav", data: base64 } },
            { text: prompt }
          ]
        }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text;
  }

  async function runGroq(audioData, key) {
    statusText.textContent = "Groq Whisper ဖြင့် အသံဖမ်းယူနေပါသည်...";
    const formData = new FormData();
    formData.append('file', audioData.blob, 'audio.wav');
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'srt');

    const whisperRes = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${key}` },
      body: formData
    });
    const originalSrt = await whisperRes.text();

    statusText.textContent = "Groq Llama 3 ဖြင့် မြန်မာစကားပြော ဘာသာပြန်နေပါသည်...";
    const transRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: [{
          role: "user",
          content: `Translate every line in this SRT to natural spoken Burmese (မြန်မာစကားပြော). Keep the exact timestamps and index numbers intact. Output raw SRT only:\n\n${originalSrt}`
        }]
      })
    });
    const transData = await transRes.json();
    if (transData.error) throw new Error(transData.error.message);
    return transData.choices[0].message.content;
  }

  processBtn.addEventListener('click', async () => {
    const mode = modeSelect.value;
    const gKey = geminiKey.value.trim();
    const grKey = groqKey.value.trim();

    if (!selectedFile) return alert("ဗီဒီယိုဖိုင် အရင်ရွေးပေးပါ");
    if (mode === 'gemini_only' && !gKey) return alert("Gemini API Key ထည့်ပေးပါ");
    if (mode === 'groq_only' && !grKey) return alert("Groq API Key ထည့်ပေးပါ");
    if (mode === 'auto' && !gKey && !grKey) return alert("API Key အနည်းဆုံး တစ်ခု ထည့်ပေးပါ");

    if (gKey) localStorage.setItem('gemini_api_key', gKey);
    if (grKey) localStorage.setItem('groq_api_key', grKey);

    processBtn.disabled = true;
    resultCard.style.display = "none";
    directDownloadLink.style.display = "none";
    statusText.textContent = "အသံဖိုင်ကို စစ်ဆေးချုံ့ယူနေပါသည်...";

    try {
      const audioData = await extractCompressedAudio(selectedFile);
      let rawSrt = "";

      if (mode === 'groq_only') {
        rawSrt = await runGroq(audioData, grKey);
      } else if (mode === 'gemini_only') {
        statusText.textContent = "Gemini AI ဖြင့် မြန်မာစာတန်းထိုး ထုတ်ပေးနေပါသည်...";
        rawSrt = await runGemini(audioData, gKey);
      } else {
        try {
          if (!gKey) throw new Error("No Gemini Key");
          statusText.textContent = "Gemini AI ဖြင့် စတင်ဆောင်ရွက်နေပါသည်...";
          rawSrt = await runGemini(audioData, gKey);
        } catch (geminiErr) {
          if (grKey) {
            statusText.textContent = "Gemini High Demand ဖြစ်သဖြင့် Groq သို့ အလိုအလျောက် ပြောင်းသုံးနေပါသည်...";
            rawSrt = await runGroq(audioData, grKey);
          } else {
            throw geminiErr;
          }
        }
      }

      rawSrt = rawSrt.replace(/^```srt\n?|^```\n?|```$/gm, '').trim();
      srtEditor.value = rawSrt;
      updateSubtitlesFromEditor();

      resultCard.style.display = "flex";
      statusText.textContent = "အောင်မြင်စွာ ပြီးဆုံးပါပြီ! Video ဖွင့်၍ စာတန်းထိုး စစ်ဆေးနိုင်ပါပြီ။";
    } catch (err) {
      statusText.textContent = "Error: " + err.message;
    } finally {
      processBtn.disabled = false;
    }
  });

  downloadSrtBtn.addEventListener('click', () => {
    const blob = new Blob([srtEditor.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "Subtitles_Edited.srt";
    a.click();
  });

  function wrapBurmeseText(ctx, text, maxWidth) {
    const lines = [];
    const rawLines = text.split('\n');
    for (const rLine of rawLines) {
      let currentLine = '';
      for (let i = 0; i < rLine.length; i++) {
        const char = rLine[i];
        const testLine = currentLine + char;
        if (ctx.measureText(testLine).width > maxWidth && currentLine.length > 0) {
          lines.push(currentLine);
          currentLine = char;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
    }
    return lines;
  }

  // စာတန်းထိုးပါ Video ကို ကြာချိန်မပျက်ဘဲ တိုက်ရိုက်ဒေါင်းလုဒ် ဆွဲပေးသည့် စနစ်
  exportVideoBtn.addEventListener('click', async () => {
    updateSubtitlesFromEditor();
    if (!parsedSubtitles.length) {
      return alert("စာတန်းထိုး မရှိသေးပါ။ အပေါ်က ခလုတ်ဖြင့် စာတန်းထိုး အရင်ထုတ်ပါ");
    }

    exportVideoBtn.disabled = true;
    directDownloadLink.style.display = "none";
    statusText.textContent = "ဗီဒီယိုကို Render ပြုလုပ်နေပါသည် (မပိတ်ဘဲ ခဏစောင့်ပါ)...";

    const canvas = document.createElement('canvas');
    canvas.width = player.videoWidth || 720;
    canvas.height = player.videoHeight || 1280;
    const ctx = canvas.getContext('2d');

    const stream = canvas.captureStream(30);

    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(player);
      const dest = audioCtx.createMediaStreamDestination();
      source.connect(dest);
      source.connect(audioCtx.destination);
      if (dest.stream.getAudioTracks().length > 0) {
        stream.addTrack(dest.stream.getAudioTracks()[0]);
      }
    } catch (e) {
      console.warn("Audio bypass:", e);
    }

    let mimeType = 'video/mp4';
    let fileExt = 'mp4';
    if (!MediaRecorder.isTypeSupported('video/mp4')) {
      mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? 'video/webm;codecs=vp8,opus' : 'video/webm';
      fileExt = 'webm';
    }

    const recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };

    let isFinished = false;
    const finishRecording = () => {
      if (isFinished) return;
      isFinished = true;
      if (recorder.state !== 'inactive') recorder.stop();
    };

    recorder.onstop = () => {
      const rawBlob = new Blob(chunks, { type: mimeType });
      const durationMs = Math.round((player.duration || 60) * 1000);

      const triggerDownload = (finalBlob) => {
        const downloadUrl = URL.createObjectURL(finalBlob);
        directDownloadLink.href = downloadUrl;
        directDownloadLink.download = `Subtitled_${Date.now()}.${fileExt}`;
        directDownloadLink.style.display = "block";

        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `Subtitled_${Date.now()}.${fileExt}`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); }, 1500);

        statusText.textContent = "ဗီဒီယို ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ! (မကျပါက အစိမ်းရောင်ခလုတ်ကို နှိပ်ပါ)";
        exportVideoBtn.disabled = false;
        player.pause();
      };

      if (typeof ysFixWebmDuration === 'function' && fileExt === 'webm' && durationMs > 0) {
        ysFixWebmDuration(rawBlob, durationMs, (fixedBlob) => {
          triggerDownload(fixedBlob);
        });
      } else {
        triggerDownload(rawBlob);
      }
    };

    recorder.start(500);
    player.currentTime = 0;
    player.muted = false;

    try {
      await player.play();
    } catch (err) {
      player.muted = true;
      await player.play();
    }

    player.onended = () => {
      finishRecording();
    };

    function renderLoop() {
      if (isFinished) return;

      if (!player.paused && !player.ended) {
        ctx.drawImage(player, 0, 0, canvas.width, canvas.height);

        const cur = player.currentTime;
        const progress = Math.round((cur / (player.duration || 1)) * 100) || 0;
        statusText.textContent = `ဗီဒီယို Render ထုတ်နေပါသည် (${progress}%)...`;

        const active = parsedSubtitles.find(s => cur >= s.start && cur <= s.end);
        if (active && active.text) {
          const fontSize = Math.floor(canvas.width * 0.046);
          ctx.font = `bold ${fontSize}px "Pyidaungsu", "Myanmar Text", sans-serif`;
          ctx.textAlign = "center";

          const maxTextWidth = canvas.width * 0.82;
          const lines = wrapBurmeseText(ctx, active.text, maxTextWidth);
          const lineHeight = fontSize * 1.45;
          const totalTextHeight = lines.length * lineHeight;
          const startY = canvas.height - (canvas.height * 0.12) - (totalTextHeight / 2);

          ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
          const boxPadding = fontSize * 0.45;
          const boxWidth = Math.min(canvas.width * 0.90, maxTextWidth + boxPadding * 2);
          ctx.fillRect(
            (canvas.width - boxWidth) / 2,
            startY - fontSize * 0.85,
            boxWidth,
            totalTextHeight + boxPadding
          );

          lines.forEach((line, index) => {
            const y = startY + (index * lineHeight);
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = Math.max(3, Math.floor(fontSize * 0.16));
            ctx.strokeText(line, canvas.width / 2, y);

            ctx.fillStyle = "#FFE500";
            ctx.fillText(line, canvas.width / 2, y);
          });
        }
      }

      if (player.currentTime >= (player.duration - 0.2) && player.duration > 0) {
        finishRecording();
        return;
      }

      requestAnimationFrame(renderLoop);
    }

    renderLoop();
  });
</script>
</body>
</html>
