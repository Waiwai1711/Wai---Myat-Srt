<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wai & Myat SRT Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 20px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
    .header { text-align: center; margin-bottom: 10px; }
    .header h2 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: #8b949e; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; font-weight: 600; color: #8b949e; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.9rem; outline: none; }
    input[type="file"] { display: none; }
    .file-drop-area { border: 2px dashed #30363d; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; background: #0d1117; }
    .file-drop-area.active { border-color: #58a6ff; background: #1f242c; }
    .file-name { font-size: 0.85rem; color: #3fb950; margin-top: 6px; word-break: break-all; }
    button { padding: 12px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #238636; color: white; }
    .btn-primary:disabled { background-color: #21262d; color: #484f58; cursor: not-allowed; }
    .btn-download { background-color: #1f6feb; color: white; display: none; }
    .status { font-size: 0.85rem; text-align: center; color: #8b949e; min-height: 18px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Wai & Myat SRT</h2>
    <p>Gemini AI ဖြင့် SRT ဖိုင်များကို မြန်မာလို အလိုအလျောက် ဘာသာပြန်စနစ်</p>
  </div>

  <div class="card">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>SRT ဖိုင် ရွေးချယ်ပါ</label>
    <label for="fileInput" class="file-drop-area" id="dropArea">
      <div id="dropText">📁 နှိပ်၍ SRT ဖိုင် ထည့်ပါ</div>
      <div class="file-name" id="fileName"></div>
    </label>
    <input type="file" id="fileInput" accept=".srt">

    <button class="btn-primary" id="translateBtn">မြန်မာလို ဘာသာပြန်မည်</button>
    <div class="status" id="statusText"></div>
    <button class="btn-download" id="downloadBtn">📥 Download Wai & Myat SRT</button>
  </div>
</div>

<script>
  let srtRawContent = "";
  let translatedSrtResult = "";
  let originalFileName = "";

  const fileInput = document.getElementById('fileInput');
  const fileNameDisplay = document.getElementById('fileName');
  const translateBtn = document.getElementById('translateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusText = document.getElementById('statusText');
  const apiKeyInput = document.getElementById('apiKey');

  if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      originalFileName = file.name;
      fileNameDisplay.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (event) => { srtRawContent = event.target.result; };
      reader.readAsText(file);
    }
  });

  translateBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("Gemini API Key ထည့်ပေးပါ");
    if (!srtRawContent) return alert("SRT ဖိုင် အရင်ရွေးပေးပါ");

    localStorage.setItem('gemini_api_key', apiKey);
    translateBtn.disabled = true;
    statusText.textContent = "Gemini ဆီသို့ ပို့ဆောင်ပြီး ဘာသာပြန်နေပါသည်...";

    const prompt = `You are an expert English to Myanmar subtitle translator.
Translate the following English SRT into natural, conversational Myanmar spoken language (စကားပြောဟန်).
CRITICAL RULES:
1. Preserve subtitle sequence numbers and timestamps EXACTLY.
2. Return ONLY the raw translated SRT plain text. Do not wrap in markdown code fences (\`\`\`srt).

SRT:
${srtRawContent}`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      translatedSrtResult = data.candidates[0].content.parts[0].text.replace(/^```srt\n?|^```\n?|```$/gm, '').trim();

      statusText.textContent = "ဘာသာပြန်ခြင်း ပြီးမြောက်ပါပြီ!";
      downloadBtn.style.display = "block";
    } catch (err) {
      statusText.textContent = "Error: " + err.message;
    } finally {
      translateBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([translatedSrtResult], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = originalFileName.replace(/\.srt$/i, '') + '_Wai_Myat.srt';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
